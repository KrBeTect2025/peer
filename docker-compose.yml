services:
  # FastAPI: serves the page + WebSocket signaling over HTTPS
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    dns: [1.1.1.1, 8.8.8.8]   # hotspot DNS is flaky; /config needs to reach the Metered API
    volumes:
      - ./certs:/app/certs:ro

  # redis = which codes are active / expired (codes are short-lived, so no persistence needed)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # this PC only, for running main.py outside Docker

  # coturn = our own STUN + TURN server
  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49400:49160-49400/udp"   # 1 port per relayed browser: ~120 rooms at once
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER}:${TURN_PASS}
      - --realm=webrtc.local
      - --external-ip=${EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49400
      - --no-tls
      - --log-file=stdout
