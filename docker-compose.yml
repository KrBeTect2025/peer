services:
  # FastAPI: serves the page + WebSocket signaling (plain HTTP; the Cloudflare tunnel adds HTTPS)
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # this PC only: everyone else comes in through the tunnel
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    dns: [1.1.1.1, 8.8.8.8]   # some networks' DNS is flaky; /config needs to reach the Metered API

  # redis = which codes are active / expired (codes are short-lived, so no persistence needed)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # this PC only, for running main.py outside Docker

  # tunnel = public https://xxxx.trycloudflare.com link to "web" (new link on every restart, see its logs)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "--url", "http://web:8000"]
    depends_on: [web]
    ports:
      - "127.0.0.1:20241:20241"   # curl http://127.0.0.1:20241/quicktunnel prints the current link
